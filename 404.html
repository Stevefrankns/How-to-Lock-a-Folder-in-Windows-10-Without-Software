.security-layer-stack::before {
    content: "";
    position: absolute;
    inset: 0;

}
.layer-card {
    position: absolute;
    left: 34px;
    right: 34px;
    height: 68px;
    border-radius: 18px;
    background: linear-gradient(135deg, rgba(255,255,255,0.13), rgba(255,255,255,0.035));
    border: 1px solid rgba(0,212,255,0.28);
    box-shadow: 0 18px 40px rgba(0,0,0,0.28);
    transform: perspective(600px) rotateX(54deg) skewX(-10deg);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
    font-family: var(--font-mono);
    color: #fff;

.layer-card::after {

    background: var(--color-primary-accent);
    box-shadow: 0 0 18px rgba(0,212,255,0.9);

.layer-card:nth-child(1) { top: 48px; transform: perspective(600px) rotateX(54deg) skewX(-10deg) translateY(-10px); }

.layer-card:nth-child(3) { top: 148px; transform: perspective(600px) rotateX(54deg) skewX(-10deg) translateY(10px); }
.layer-card:nth-child(4) { top: 198px; transform: perspective(600px) rotateX(54deg) skewX(-10deg) translateY(20px); }
